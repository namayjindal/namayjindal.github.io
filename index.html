<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>namay</title>
<meta name="description" content="Namay Jindal — product, code, New York. A risograph print of the softboard from my room.">
<link rel="icon" href="/assets/logo.png" type="image/png">
<link rel="stylesheet" href="/styles/board.css">
<link rel="preload" as="image" href="/assets/riso/board.webp">
</head>
<body>
  <main class="page">
    <section class="col" id="col">
      <a class="logo" href="/"><img src="/assets/riso/logo.webp" alt="namay logo" width="96" height="96"></a>
      <h1 class="wordmark">namay</h1>
      <p class="tagline"></p>
      <p class="blurb"></p>
      <nav class="jump" aria-label="sections"></nav>
      <p class="hint"></p>
      <ul class="contacts"></ul>
    </section>

    <section class="board-wrap" aria-label="softboard">
      <div class="stage-fit"><div class="stage" id="stage"></div></div>
    </section>
  </main>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-heading" hidden>
    <div class="sheet">
      <button class="close" id="panel-close" aria-label="close">close</button>
      <h2 id="panel-heading"></h2>
      <div class="body" id="panel-body"></div>
    </div>
  </div>

  <script src="/scripts/board.js"></script>
</body>
</html>
