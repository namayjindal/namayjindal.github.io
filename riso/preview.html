<!doctype html>
<meta charset="utf-8">
<title>riso layers preview</title>
<style>
  /* Proof that the exported ink layers composite correctly in a browser.
     Open via a local server (python3 -m http.server) so fetch() works. */
  body { margin: 0; background: rgb(246, 238, 222); font-family: -apple-system, Helvetica Neue, sans-serif; }
  #stage { position: relative; width: 1600px; height: 1000px; transform-origin: top left; }
  .ink { position: absolute; mix-blend-mode: multiply; pointer-events: none; image-rendering: auto; }
  .note { cursor: pointer; pointer-events: auto;
          transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
  .note:hover { transform: translate(-6px, -10px) rotate(-1.5deg) scale(1.03); }
  .shadow { transition: transform .35s ease, opacity .35s ease; }
  .note:hover + .shadow, .shadow.lift { transform: translate(8px, 12px); opacity: .55; }
</style>
<div id="stage"></div>
<script>
  // Order in manifest.json is paint order: board, then per note [shadow, note, pin], then type.
  fetch('out/layers/manifest.json').then(r => r.json()).then(m => {
    const stage = document.getElementById('stage');
    const scale = Math.min(1, innerWidth / m.canvas[0]);
    stage.style.transform = `scale(${scale})`;
    const byId = {};
    for (const e of m.elements) {
      const img = new Image();
      img.src = `out/layers/${e.id}.png`;
      img.className = 'ink';
      Object.assign(img.style, { left: e.x + 'px', top: e.y + 'px', width: e.w + 'px', height: e.h + 'px' });
      if (e.id.endsWith('-shadow')) img.classList.add('shadow');
      else if (!e.id.endsWith('-pin') && !['board', 'type', 'type-accent'].includes(e.id)) img.classList.add('note');
      byId[e.id] = img;
      stage.appendChild(img);
    }
    // shadow sits *under* its note in paint order, so :hover + sibling won't reach it; wire it by hand
    for (const id in byId) if (byId[id].classList.contains('note')) {
      byId[id].onmouseenter = () => byId[id + '-shadow']?.classList.add('lift');
      byId[id].onmouseleave = () => byId[id + '-shadow']?.classList.remove('lift');
    }
  });
</script>
